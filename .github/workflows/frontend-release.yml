name: Frontend Release

on:
  push:
    tags:
      - "frontend-v*"

permissions:
  contents: read

concurrency:
  group: frontend-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify frontend release source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      major_minor: ${{ steps.version.outputs.major_minor }}
      major: ${{ steps.version.outputs.major }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate frontend version tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#frontend-v}"
          if [[ "${version}" == "${RELEASE_TAG}" || ! "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Frontend release tag must look like frontend-v1.2.3 or frontend-v1.2.3-rc.1"
            exit 1
          fi
          base_version="${version%%[-+]*}"
          IFS=. read -r major minor _ <<< "${base_version}"
          prerelease=false
          if [[ "${version}" == *-* ]]; then prerelease=true; fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "major_minor=${major}.${minor}" >> "${GITHUB_OUTPUT}"
          echo "major=${major}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Verify generated API types
        working-directory: .
        run: git diff --exit-code -- frontend/src/api/generated/schema.d.ts

  bundle:
    name: Build frontend release bundle
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Create frontend archive
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir -p ../release
          tar -C dist -czf "../release/conduit-frontend-v${RELEASE_VERSION}.tar.gz" .

      - name: Upload frontend archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: frontend-bundle
          path: release/*
          if-no-files-found: error
          retention-days: 1

  github-release:
    name: Publish frontend GitHub Release
    needs: [verify, bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download frontend archive
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: frontend-bundle
          path: release

      - name: Create checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS

      - name: Publish frontend release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          release_flags=()
          if [[ "${PRERELEASE}" == "true" ]]; then release_flags+=(--prerelease); fi
          gh release create "${RELEASE_TAG}" release/* \
            --verify-tag \
            --generate-notes \
            --title "Frontend v${RELEASE_VERSION}" \
            "${release_flags[@]}"

  container:
    name: Publish frontend container
    needs: [verify, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate frontend image metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}-frontend
          tags: |
            type=raw,value=${{ needs.verify.outputs.version }}
            type=raw,value=${{ needs.verify.outputs.major_minor }},enable=${{ needs.verify.outputs.prerelease == 'false' }}
            type=raw,value=${{ needs.verify.outputs.major }},enable=${{ needs.verify.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.prerelease == 'false' }}

      - name: Build and push frontend image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: frontend-runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Attest frontend image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}-frontend
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
