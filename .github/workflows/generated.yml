name: Generated Code

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated:
    name: Generated files are current
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Regenerate code and architecture graph
        run: |
          make generate
          make arch-graph

      - name: Verify clean working tree
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Generated files are out of date. Run 'make generate' and 'make arch-graph', then commit the result."
            git status --short
            git diff --check
            git diff
            exit 1
          fi
