{{define "content"}}
<div class="auth-page"><div class="container page"><div class="row"><div class="col-md-6 offset-md-3 col-xs-12">
  <h1 class="text-xs-center">Sign in</h1>
  <p class="text-xs-center"><a href="/register">Need an account?</a></p>
  {{if .Errors}}<ul class="error-messages">{{range .Errors}}<li>{{.}}</li>{{end}}</ul>{{end}}
  <form method="post" action="/login">
    <fieldset class="form-group"><input class="form-control form-control-lg" name="email" type="email" value="{{index .Form "email"}}" placeholder="Email" required></fieldset>
    <fieldset class="form-group"><input class="form-control form-control-lg" name="password" type="password" placeholder="Password" required></fieldset>
    <button class="btn btn-lg btn-primary pull-xs-right" type="submit">Sign in</button>
  </form>
</div></div></div></div>
{{end}}
