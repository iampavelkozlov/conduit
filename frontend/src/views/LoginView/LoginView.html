<section class="center-column auth-page">
  <h1>Sign in</h1>
  <p><RouterLink :to="{ name: 'register' }">Need an account?</RouterLink></p>
  <ErrorMessages :messages="errors" />
  <form @submit.prevent="submit">
    <div class="form-group"><input v-model="email" class="form-control form-control-lg" type="email" autocomplete="email" placeholder="Email" required /></div>
    <div class="form-group"><input v-model="password" class="form-control form-control-lg" type="password" autocomplete="current-password" placeholder="Password" required /></div>
    <button class="btn btn-lg btn-primary pull-right" type="submit" :disabled="submitting">Sign in</button>
  </form>
</section>
