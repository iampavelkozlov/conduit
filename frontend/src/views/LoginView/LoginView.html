<section class="mx-auto flex w-full max-w-md items-center px-4 py-12 sm:px-0 sm:py-20">
  <Card class="w-full">
    <CardHeader>
      <CardTitle>Welcome back</CardTitle>
      <CardDescription>Sign in to publish, follow authors, and join the conversation.</CardDescription>
    </CardHeader>
    <form @submit.prevent="submit">
      <CardContent class="flex flex-col gap-5">
        <ErrorMessages :messages="errors" />
        <FieldGroup>
          <Field :data-invalid="errors.length > 0 || undefined">
            <FieldLabel for="login-email">Email</FieldLabel>
            <Input id="login-email" v-model="email" type="email" autocomplete="email" placeholder="you@example.com" required :aria-invalid="errors.length > 0 || undefined" />
          </Field>
          <Field :data-invalid="errors.length > 0 || undefined">
            <FieldLabel for="login-password">Password</FieldLabel>
            <Input id="login-password" v-model="password" type="password" autocomplete="current-password" placeholder="Your password" required :aria-invalid="errors.length > 0 || undefined" />
          </Field>
        </FieldGroup>
      </CardContent>
      <CardFooter class="flex-col gap-4">
        <Button class="w-full" type="submit" :disabled="submitting">
          <Spinner v-if="submitting" data-icon="inline-start" />
          <LogInIcon v-else data-icon="inline-start" />
          {{ submitting ? 'Signing in...' : 'Sign in' }}
        </Button>
        <p class="text-sm text-muted-foreground">New to Conduit? <RouterLink class="font-medium text-primary" :to="{ name: 'register' }">Create an account</RouterLink></p>
      </CardFooter>
    </form>
  </Card>
</section>
