<section class="mx-auto w-full max-w-3xl px-4 py-10 sm:px-6 sm:py-14">
  <Card>
    <CardHeader>
      <CardTitle>{{ editing ? 'Edit article' : 'Create a new article' }}</CardTitle>
      <CardDescription>{{ editing ? 'Refine your story and keep your readers up to date.' : 'Share an idea, lesson, or experience with the community.' }}</CardDescription>
    </CardHeader>
    <CardContent v-if="loading" class="flex flex-col gap-4">
      <Skeleton class="h-10 w-full" /><Skeleton class="h-10 w-full" /><Skeleton class="h-64 w-full" /><Skeleton class="h-10 w-full" />
    </CardContent>
    <form v-else @submit.prevent="submit">
      <CardContent class="flex flex-col gap-5">
        <ErrorMessages :messages="errors" />
        <FieldGroup>
          <Field :data-invalid="errors.length > 0 || undefined">
            <FieldLabel for="article-title">Title</FieldLabel>
            <Input id="article-title" v-model="title" placeholder="A clear, useful title" required :aria-invalid="errors.length > 0 || undefined" />
          </Field>
          <Field :data-invalid="errors.length > 0 || undefined">
            <FieldLabel for="article-description">Description</FieldLabel>
            <Input id="article-description" v-model="description" placeholder="A short summary for the feed" required :aria-invalid="errors.length > 0 || undefined" />
          </Field>
          <Field :data-invalid="errors.length > 0 || undefined">
            <FieldLabel for="article-body">Article body</FieldLabel>
            <Textarea id="article-body" v-model="body" rows="14" placeholder="Write your article..." required :aria-invalid="errors.length > 0 || undefined" />
          </Field>
          <Field>
            <FieldLabel for="article-tags">Tags</FieldLabel>
            <Input id="article-tags" v-model="tags" placeholder="vue, go, architecture" />
            <FieldDescription>Separate tags with commas.</FieldDescription>
          </Field>
        </FieldGroup>
      </CardContent>
      <CardFooter class="justify-end">
        <Button type="submit" :disabled="submitting">
          <Spinner v-if="submitting" data-icon="inline-start" />
          <SendIcon v-else data-icon="inline-start" />
          {{ submitting ? 'Saving...' : editing ? 'Update article' : 'Publish article' }}
        </Button>
      </CardFooter>
    </form>
  </Card>
</section>
