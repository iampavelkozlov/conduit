<section class="center-column auth-page">
  <h1>Sign up</h1>
  <p><RouterLink :to="{ name: 'login' }">Have an account?</RouterLink></p>
  <ErrorMessages :messages="errors" />
  <form @submit.prevent="submit">
    <div class="form-group"><input v-model="username" class="form-control form-control-lg" autocomplete="username" placeholder="Username" required /></div>
    <div class="form-group"><input v-model="email" class="form-control form-control-lg" type="email" autocomplete="email" placeholder="Email" required /></div>
    <div class="form-group"><input v-model="password" class="form-control form-control-lg" type="password" autocomplete="new-password" placeholder="Password" required /></div>
    <button class="btn btn-lg btn-primary pull-right" type="submit" :disabled="submitting">Sign up</button>
  </form>
</section>
