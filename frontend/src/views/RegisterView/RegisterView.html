<section class="mx-auto flex w-full max-w-md items-center px-4 py-12 sm:px-0 sm:py-20">
  <Card class="w-full">
    <CardHeader>
      <CardTitle>Create your account</CardTitle>
      <CardDescription>Join the community and start sharing what you know.</CardDescription>
    </CardHeader>
    <form @submit.prevent="submit">
      <CardContent class="flex flex-col gap-5">
        <ErrorMessages :messages="errors" />
        <FieldGroup>
          <Field :data-invalid="errors.length > 0 || undefined">
            <FieldLabel for="register-username">Username</FieldLabel>
            <Input id="register-username" v-model="username" autocomplete="username" placeholder="jane-doe" required :aria-invalid="errors.length > 0 || undefined" />
          </Field>
          <Field :data-invalid="errors.length > 0 || undefined">
            <FieldLabel for="register-email">Email</FieldLabel>
            <Input id="register-email" v-model="email" type="email" autocomplete="email" placeholder="you@example.com" required :aria-invalid="errors.length > 0 || undefined" />
          </Field>
          <Field :data-invalid="errors.length > 0 || undefined">
            <FieldLabel for="register-password">Password</FieldLabel>
            <Input id="register-password" v-model="password" type="password" autocomplete="new-password" placeholder="Choose a secure password" required :aria-invalid="errors.length > 0 || undefined" />
          </Field>
        </FieldGroup>
      </CardContent>
      <CardFooter class="flex-col gap-4">
        <Button class="w-full" type="submit" :disabled="submitting">
          <Spinner v-if="submitting" data-icon="inline-start" />
          <UserPlusIcon v-else data-icon="inline-start" />
          {{ submitting ? 'Creating account...' : 'Create account' }}
        </Button>
        <p class="text-sm text-muted-foreground">Already have an account? <RouterLink class="font-medium text-primary" :to="{ name: 'login' }">Sign in</RouterLink></p>
      </CardFooter>
    </form>
  </Card>
</section>
