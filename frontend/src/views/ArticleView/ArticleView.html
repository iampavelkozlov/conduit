<div class="mx-auto w-full max-w-5xl px-4 py-8 sm:px-6 sm:py-12">
  <div v-if="loading" class="flex flex-col gap-6">
    <Card>
      <CardHeader><Skeleton class="h-10 w-3/4" /><div class="flex items-center gap-3"><Skeleton class="size-10 rounded-full" /><Skeleton class="h-4 w-32" /></div></CardHeader>
      <CardContent class="flex flex-col gap-3"><Skeleton class="h-4 w-full" /><Skeleton class="h-4 w-full" /><Skeleton class="h-4 w-2/3" /></CardContent>
    </Card>
  </div>
  <ErrorMessages v-else-if="!article" :messages="errors" />
  <div v-else class="flex flex-col gap-8">
    <Card>
      <CardHeader class="gap-5">
        <div class="flex flex-wrap items-start justify-between gap-4">
          <div class="flex min-w-0 flex-1 flex-col gap-3">
            <CardTitle>{{ article.title }}</CardTitle>
            <CardDescription>{{ article.description }}</CardDescription>
          </div>
          <ArticleActions :article="article" @updated="article = $event" @failed="setErrors" />
        </div>
        <div class="flex items-center gap-3">
          <RouterLink :to="{ name: 'profile', params: { username: article.author.username } }">
            <Avatar>
              <AvatarImage :src="avatarUrl(article.author.image)" :alt="article.author.username" />
              <AvatarFallback>{{ initials(article.author.username) }}</AvatarFallback>
            </Avatar>
          </RouterLink>
          <div class="flex flex-col">
            <RouterLink class="font-medium text-foreground hover:text-primary" :to="{ name: 'profile', params: { username: article.author.username } }">{{ article.author.username }}</RouterLink>
            <time class="text-sm text-muted-foreground" :datetime="article.createdAt">{{ formatDate(article.createdAt) }}</time>
          </div>
        </div>
      </CardHeader>
      <CardContent>
        <RichTextContent :content="article.body" />
      </CardContent>
      <CardFooter class="flex-wrap gap-2">
        <Badge v-for="tag in article.tagList" :key="tag" variant="secondary">{{ tag }}</Badge>
      </CardFooter>
    </Card>

    <ErrorMessages :messages="errors" />

    <section class="mx-auto flex w-full max-w-3xl flex-col gap-4">
      <div class="flex items-center gap-2"><MessageSquareIcon class="size-5 text-primary" aria-hidden="true" /><h2 class="text-xl font-semibold">Conversation</h2></div>

      <Card v-if="auth.user">
        <form @submit.prevent="submitComment">
          <CardHeader>
            <div class="flex items-center gap-3">
              <Avatar>
                <AvatarImage :src="avatarUrl(auth.user.image)" :alt="auth.user.username" />
                <AvatarFallback>{{ initials(auth.user.username) }}</AvatarFallback>
              </Avatar>
              <div><CardTitle>Add a comment</CardTitle><CardDescription>Share a constructive thought with the author.</CardDescription></div>
            </div>
          </CardHeader>
          <CardContent>
            <FieldGroup>
              <Field>
                <FieldLabel class="sr-only" for="comment-body">Comment</FieldLabel>
                <Textarea id="comment-body" v-model="commentBody" rows="4" placeholder="Write a comment..." required />
              </Field>
            </FieldGroup>
          </CardContent>
          <CardFooter class="justify-end">
            <Button type="submit" :disabled="submittingComment">
              <Spinner v-if="submittingComment" data-icon="inline-start" />
              <SendIcon v-else data-icon="inline-start" />
              {{ submittingComment ? 'Posting...' : 'Post comment' }}
            </Button>
          </CardFooter>
        </form>
      </Card>
      <Card v-else>
        <CardHeader><CardTitle>Join the conversation</CardTitle><CardDescription>Sign in or create an account to add a comment.</CardDescription></CardHeader>
        <CardFooter class="gap-2"><Button as-child><RouterLink :to="{ name: 'login' }">Sign in</RouterLink></Button><Button variant="outline" as-child><RouterLink :to="{ name: 'register' }">Sign up</RouterLink></Button></CardFooter>
      </Card>

      <Card v-for="comment in comments" :key="comment.id">
        <CardHeader>
          <div class="flex items-center gap-3">
            <RouterLink :to="{ name: 'profile', params: { username: comment.author.username } }">
              <Avatar>
                <AvatarImage :src="avatarUrl(comment.author.image)" :alt="comment.author.username" />
                <AvatarFallback>{{ initials(comment.author.username) }}</AvatarFallback>
              </Avatar>
            </RouterLink>
            <div class="flex flex-col">
              <RouterLink class="font-medium text-foreground hover:text-primary" :to="{ name: 'profile', params: { username: comment.author.username } }">{{ comment.author.username }}</RouterLink>
              <time class="text-sm text-muted-foreground" :datetime="comment.createdAt">{{ formatDate(comment.createdAt) }}</time>
            </div>
          </div>
        </CardHeader>
        <CardContent><p class="whitespace-pre-wrap leading-7">{{ comment.body }}</p></CardContent>
        <CardFooter v-if="auth.user?.username === comment.author.username" class="justify-end">
          <AlertDialog>
            <AlertDialogTrigger as-child><Button variant="ghost" size="sm"><Trash2Icon data-icon="inline-start" />Delete</Button></AlertDialogTrigger>
            <AlertDialogContent>
              <AlertDialogHeader><AlertDialogTitle>Delete this comment?</AlertDialogTitle><AlertDialogDescription>This action cannot be undone.</AlertDialogDescription></AlertDialogHeader>
              <AlertDialogFooter><AlertDialogCancel>Cancel</AlertDialogCancel><AlertDialogAction variant="destructive" @click="removeComment(comment)">Delete comment</AlertDialogAction></AlertDialogFooter>
            </AlertDialogContent>
          </AlertDialog>
        </CardFooter>
      </Card>

      <Empty v-if="comments.length === 0" class="rounded-xl border bg-card">
        <EmptyHeader><EmptyMedia variant="icon"><MessageSquareIcon /></EmptyMedia><EmptyTitle>No comments yet</EmptyTitle><EmptyDescription>Start a thoughtful conversation about this article.</EmptyDescription></EmptyHeader>
      </Empty>
    </section>
  </div>
</div>
