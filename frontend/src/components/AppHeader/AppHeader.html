<header class="sticky top-0 border-b bg-background/95 backdrop-blur supports-[backdrop-filter]:bg-background/80">
  <nav class="mx-auto flex h-16 w-full max-w-6xl items-center justify-between px-4 sm:px-6" aria-label="Main navigation">
    <RouterLink class="inline-flex items-center gap-2 text-lg font-semibold tracking-tight text-foreground" :to="{ name: 'home' }">
      <span class="flex size-9 items-center justify-center rounded-xl bg-primary text-primary-foreground">
        <BookOpenIcon class="size-5" aria-hidden="true" />
      </span>
      conduit
    </RouterLink>

    <div class="flex items-center gap-1">
      <div class="hidden items-center gap-1 md:flex">
        <Button variant="ghost" as-child>
          <RouterLink :to="{ name: 'home' }"><HomeIcon data-icon="inline-start" />Home</RouterLink>
        </Button>
        <template v-if="user">
          <Button variant="ghost" as-child>
            <RouterLink :to="{ name: 'editor' }"><PenLineIcon data-icon="inline-start" />New article</RouterLink>
          </Button>
          <DropdownMenu>
            <DropdownMenuTrigger as-child>
              <Button variant="ghost">
                <Avatar class="size-7">
                  <AvatarImage :src="avatarUrl(user.image)" :alt="user.username" />
                  <AvatarFallback>{{ initials(user.username) }}</AvatarFallback>
                </Avatar>
                {{ user.username }}
              </Button>
            </DropdownMenuTrigger>
            <DropdownMenuContent align="end" class="w-56">
              <DropdownMenuGroup>
                <DropdownMenuLabel>My account</DropdownMenuLabel>
              </DropdownMenuGroup>
              <DropdownMenuSeparator />
              <DropdownMenuGroup>
                <DropdownMenuItem as-child>
                  <RouterLink :to="{ name: 'profile', params: { username: user.username } }">Profile</RouterLink>
                </DropdownMenuItem>
                <DropdownMenuItem as-child>
                  <RouterLink :to="{ name: 'settings' }"><SettingsIcon />Settings</RouterLink>
                </DropdownMenuItem>
              </DropdownMenuGroup>
              <DropdownMenuSeparator />
              <DropdownMenuGroup>
                <DropdownMenuItem @select="logout"><LogOutIcon />Log out</DropdownMenuItem>
              </DropdownMenuGroup>
            </DropdownMenuContent>
          </DropdownMenu>
        </template>
        <template v-else>
          <Button variant="ghost" as-child>
            <RouterLink :to="{ name: 'login' }"><LogInIcon data-icon="inline-start" />Sign in</RouterLink>
          </Button>
          <Button as-child>
            <RouterLink :to="{ name: 'register' }"><UserPlusIcon data-icon="inline-start" />Sign up</RouterLink>
          </Button>
        </template>
      </div>

      <ThemeToggle />

      <Sheet>
      <SheetTrigger as-child>
        <Button class="md:hidden" variant="outline" size="icon" aria-label="Open navigation">
          <MenuIcon />
        </Button>
      </SheetTrigger>
      <SheetContent side="right">
        <SheetHeader>
          <SheetTitle>Navigation</SheetTitle>
          <SheetDescription>Explore Conduit and manage your account.</SheetDescription>
        </SheetHeader>
        <div class="flex flex-col gap-2 px-4">
          <SheetClose as-child>
            <Button variant="ghost" class="w-full justify-start" as-child>
              <RouterLink :to="{ name: 'home' }"><HomeIcon data-icon="inline-start" />Home</RouterLink>
            </Button>
          </SheetClose>
          <template v-if="user">
            <SheetClose as-child>
              <Button variant="ghost" class="w-full justify-start" as-child>
                <RouterLink :to="{ name: 'editor' }"><PenLineIcon data-icon="inline-start" />New article</RouterLink>
              </Button>
            </SheetClose>
            <SheetClose as-child>
              <Button variant="ghost" class="w-full justify-start" as-child>
                <RouterLink :to="{ name: 'profile', params: { username: user.username } }">
                  <Avatar class="size-6">
                    <AvatarImage :src="avatarUrl(user.image)" :alt="user.username" />
                    <AvatarFallback>{{ initials(user.username) }}</AvatarFallback>
                  </Avatar>
                  {{ user.username }}
                </RouterLink>
              </Button>
            </SheetClose>
            <SheetClose as-child>
              <Button variant="ghost" class="w-full justify-start" as-child>
                <RouterLink :to="{ name: 'settings' }"><SettingsIcon data-icon="inline-start" />Settings</RouterLink>
              </Button>
            </SheetClose>
            <SheetClose as-child>
              <Button variant="ghost" class="w-full justify-start" @click="logout"><LogOutIcon data-icon="inline-start" />Log out</Button>
            </SheetClose>
          </template>
          <template v-else>
            <SheetClose as-child>
              <Button variant="ghost" class="w-full justify-start" as-child>
                <RouterLink :to="{ name: 'login' }"><LogInIcon data-icon="inline-start" />Sign in</RouterLink>
              </Button>
            </SheetClose>
            <SheetClose as-child>
              <Button class="w-full justify-start" as-child>
                <RouterLink :to="{ name: 'register' }"><UserPlusIcon data-icon="inline-start" />Sign up</RouterLink>
              </Button>
            </SheetClose>
          </template>
        </div>
      </SheetContent>
      </Sheet>
    </div>
  </nav>
</header>
