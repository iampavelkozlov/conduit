<Card>
  <CardHeader>
    <div class="flex min-w-0 items-center gap-3">
      <RouterLink :to="{ name: 'profile', params: { username: article.author.username } }">
        <Avatar>
          <AvatarImage :src="avatarUrl(article.author.image)" :alt="article.author.username" />
          <AvatarFallback>{{ initials(article.author.username) }}</AvatarFallback>
        </Avatar>
      </RouterLink>
      <div class="flex min-w-0 flex-col">
        <RouterLink class="truncate font-medium text-foreground hover:text-primary" :to="{ name: 'profile', params: { username: article.author.username } }">
          {{ article.author.username }}
        </RouterLink>
        <time class="text-sm text-muted-foreground" :datetime="article.createdAt">{{ formatDate(article.createdAt) }}</time>
      </div>
    </div>
    <CardAction>
      <Button :variant="article.favorited ? 'default' : 'outline'" size="sm" type="button" :disabled="busy" @click="toggleFavorite">
        <HeartIcon data-icon="inline-start" />
        {{ article.favoritesCount }}
      </Button>
    </CardAction>
    <RouterLink class="transition-colors hover:text-primary" :to="{ name: 'article', params: { slug: article.slug } }">
      <CardTitle>{{ article.title }}</CardTitle>
    </RouterLink>
    <CardDescription>{{ article.description }}</CardDescription>
  </CardHeader>
  <CardContent v-if="article.tagList.length" class="flex flex-wrap gap-2">
    <Badge v-for="tag in article.tagList" :key="tag" variant="secondary">{{ tag }}</Badge>
  </CardContent>
  <CardFooter class="justify-end">
    <Button variant="ghost" size="sm" as-child>
      <RouterLink :to="{ name: 'article', params: { slug: article.slug } }">Read article<ArrowRightIcon data-icon="inline-end" /></RouterLink>
    </Button>
  </CardFooter>
</Card>
