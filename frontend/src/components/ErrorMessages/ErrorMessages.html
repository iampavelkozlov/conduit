<Alert v-if="messages.length" variant="destructive" role="alert">
  <CircleAlertIcon />
  <AlertTitle>Something went wrong</AlertTitle>
  <AlertDescription>
    <ul class="flex list-disc flex-col gap-1 pl-4">
      <li v-for="message in messages" :key="message">{{ message }}</li>
    </ul>
  </AlertDescription>
</Alert>
