<div>
  <p v-if="loading" class="loading">Loading articles...</p>
  <p v-else-if="articles.length === 0" class="empty-state">No articles are here... yet.</p>
  <ArticlePreview
    v-for="article in articles"
    v-else
    :key="article.slug"
    :article="article"
    @updated="$emit('updated', $event)"
  />
</div>
