api:
  url: "http://localhost:8080/api"
  timeout: "10s"

http:
  addr: ":3000"
  read_header_timeout: "5s"
  read_timeout: "15s"
  write_timeout: "30s"
  idle_timeout: "2m"
  shutdown_timeout: "10s"
  max_header_bytes: 1048576
  max_form_bytes: 1048576

session:
  cookie_name: "conduit_session"
  secure: false
  ttl: "15m"

logger:
  level: "info"   # debug|info|warn|error
  format: "text"  # text|json
