db:
  dsn: "postgres://postgres:postgres@localhost:5432/conduit?sslmode=disable"

logger:
  level: "info"   # debug|info|warn|error
  format: "text"  # text|json

http:
  # Override HTTP_ALLOWED_ORIGINS with a comma-separated production allowlist.
  allowed_origins: ["*"]

auth:
  jwt_secret: "development-only-change-me-jwt-secret"
  password_pepper: "development-change-me-pepper"
  access_token_ttl: "15m"
  refresh_token_ttl: "720h"
