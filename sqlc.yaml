version: "2"
sql:
  - schema:
      - "services/auth/migrations/00001_create_credentials.sql"
      - "services/posts/migrations/00001_create_posts.sql"
      - "services/posts/migrations/00002_event_outbox.sql"
      - "services/comments/migrations/00001_create_comments.sql"
      - "services/subscriptions/migrations/00001_create_follows.sql"
    queries:
      - "migrations/queries/*.sql"
    engine: "postgresql"
    gen:
      go:
        out: "internal/gen/postgres"
        package: "postgres"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: false
