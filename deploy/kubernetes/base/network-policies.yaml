apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-public-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - {protocol: TCP, port: 8000}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: application-traffic
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [gateway, auth, profile, posts, subscriptions, comments, subscriptions-outbox, posts-outbox, profile-outbox]
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [gateway, auth, profile, posts, subscriptions, comments, subscriptions-outbox, posts-outbox, profile-outbox]
      ports:
        - {protocol: TCP, port: 8000}
        - {protocol: TCP, port: 9001}
        - {protocol: TCP, port: 9002}
        - {protocol: TCP, port: 9003}
        - {protocol: TCP, port: 9004}
        - {protocol: TCP, port: 9005}
        - {protocol: TCP, port: 9100}
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [gateway, auth, profile, posts, subscriptions, comments, subscriptions-outbox, posts-outbox, profile-outbox, postgres, redis, kafka, deployment-job]
      ports:
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 6379}
        - {protocol: TCP, port: 9092}
        - {protocol: TCP, port: 8000}
        - {protocol: TCP, port: 9001}
        - {protocol: TCP, port: 9002}
        - {protocol: TCP, port: 9003}
        - {protocol: TCP, port: 9004}
        - {protocol: TCP, port: 9005}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-traffic
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [postgres, redis, kafka]
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [gateway, auth, profile, posts, subscriptions, comments, subscriptions-outbox, posts-outbox, profile-outbox, postgres, redis, kafka, deployment-job]
      ports:
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 6379}
        - {protocol: TCP, port: 9092}
        - {protocol: TCP, port: 9093}
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [postgres, redis, kafka]
      ports:
        - {protocol: TCP, port: 9092}
        - {protocol: TCP, port: 9093}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deployment-jobs
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: deployment-job
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [postgres, kafka]
      ports:
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 9092}
