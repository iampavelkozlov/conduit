apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
      containers:
        - name: gateway
          image: conduit:local
          imagePullPolicy: IfNotPresent
          command: ["/app/conduit"]
          args: ["--addr=:8000"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: conduit-config
          env:
            - name: DB_DSN
              valueFrom:
                secretKeyRef:
                  name: conduit-secrets
                  key: DB_DSN
            - name: AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: conduit-secrets
                  key: AUTH_JWT_SECRET
            - name: AUTH_PASSWORD_PEPPER
              valueFrom:
                secretKeyRef:
                  name: conduit-secrets
                  key: AUTH_PASSWORD_PEPPER
          startupProbe:
            httpGet:
              path: /metrics
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: subscriptions-outbox
spec:
  selector:
    app.kubernetes.io/name: subscriptions-outbox
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: subscriptions-outbox
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: subscriptions-outbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: subscriptions-outbox
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: subscriptions-outbox
      containers:
        - name: relay
          image: conduit:local
          imagePullPolicy: IfNotPresent
          command: ["/app/outbox-relay"]
          args: ["--config=/app/config/outbox-relay.yaml"]
          ports:
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: conduit-config
          env:
            - name: OUTBOX_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: conduit-secrets
                  key: SUBSCRIPTIONS_DB_DSN
            - {name: OUTBOX_SOURCE, value: "subscriptions"}
            - {name: OUTBOX_METRICS_ADDR, value: ":9100"}
            - {name: KAFKA_CLIENT_ID, value: "subscriptions-outbox"}
          startupProbe:
            httpGet: {path: /healthz, port: metrics}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
---
