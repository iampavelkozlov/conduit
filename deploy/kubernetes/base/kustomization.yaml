apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: conduit
resources:
  - namespace.yaml
  - configuration.yaml
  - development-secrets.yaml
  - platform.yaml
  - workloads.yaml
  - availability.yaml
  - network-policies.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: conduit
    includeSelectors: true
    includeTemplates: true
