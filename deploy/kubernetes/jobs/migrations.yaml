apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 6
  template:
    metadata:
      labels: {app.kubernetes.io/name: deployment-job}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-topics
          image: apache/kafka:4.1.0
          command: [/bin/bash, -ec]
          args:
            - |
              for topic in conduit.articles conduit.profiles conduit.subscriptions; do
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$topic" --partitions 6 --replication-factor 1
              done
