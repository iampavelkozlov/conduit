# These jobs are intentionally not part of the base. Service-specific jobs are
# suspended until their images contain /app/goose and /app/migrations/<service>.
apiVersion: batch/v1
kind: Job
metadata:
  name: gateway-migrate
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: goose
          image: conduit:local
          command: [/app/goose]
          args: [-dir, /app/migrations, postgres, "$(DB_DSN)", up]
          env:
            - name: DB_DSN
              valueFrom: {secretKeyRef: {name: conduit-secrets, key: DB_DSN}}
---
