# Migration jobs are applied separately from the long-running base so schema
# rollout remains an explicit deployment step.
apiVersion: batch/v1
kind: Job
metadata:
  name: gateway-migrate
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    metadata:
      labels: {app.kubernetes.io/name: deployment-job}
    spec:
      restartPolicy: Never
      containers:
        - name: goose
          image: conduit:local
          command: [/app/goose]
          args: [-dir, /app/migrations, postgres, "$(DB_DSN)", up]
          env:
            - name: DB_DSN
              valueFrom: {secretKeyRef: {name: conduit-secrets, key: DB_DSN}}
---
