name: conduit-microservices

x-service: &service
  image: ${CONDUIT_IMAGE:-conduit:local}
  pull_policy: never
  restart: unless-stopped
  init: true
  environment: &service-environment
    LOG_LEVEL: ${LOG_LEVEL:-info}
    LOG_FORMAT: ${LOG_FORMAT:-json}
    KAFKA_BROKERS: kafka:9092
    REDIS_ADDR: redis:6379
  depends_on: &service-dependencies
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [conduit]

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [conduit]

  kafka:
    image: apache/kafka:4.1.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:${KAFKA_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
    ports:
      - "${KAFKA_PORT:-29092}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [conduit]

  kafka-init:
    image: apache/kafka:4.1.0
    profiles: [microservices]
    restart: "no"
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        for topic in conduit.articles conduit.profiles conduit.subscriptions; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 6 --replication-factor 1
        done
    depends_on:
      kafka:
        condition: service_healthy
    networks: [conduit]

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [conduit]

  gateway:
    <<: *service
    profiles: [microservices]
    entrypoint: ["/app/conduit"]
    command: ["--addr=:8000"]
    environment:
      <<: *service-environment
      AUTH_GRPC_TARGET: auth:9001
      PROFILE_GRPC_TARGET: profile:9002
      POSTS_GRPC_TARGET: posts:9003
      SUBSCRIPTIONS_GRPC_TARGET: subscriptions:9004
      COMMENTS_GRPC_TARGET: comments:9005
      HTTP_ALLOWED_ORIGINS: ${HTTP_ALLOWED_ORIGINS:-*}
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8000/metrics"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    image: ${CONDUIT_IMAGE:-conduit:local}
    pull_policy: never
    profiles: [microservices]
    restart: unless-stopped
    init: true
    entrypoint: ["/app/frontend"]
    command: ["--config=/app/config/frontend.yaml"]
    environment:
      FRONTEND_API_URL: http://gateway:8000/api
      FRONTEND_LOG_LEVEL: ${FRONTEND_LOG_LEVEL:-info}
      FRONTEND_LOG_FORMAT: ${FRONTEND_LOG_FORMAT:-json}
      FRONTEND_COOKIE_SECURE: ${FRONTEND_COOKIE_SECURE:-false}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks: [conduit]

  auth:
    <<: *service
    profiles: [microservices]
    entrypoint: ["/app/auth"]
    command: ["--addr=:9001"]
    environment:
      <<: *service-environment
      AUTH_DB_DSN: postgres://conduit_auth:auth@postgres:5432/conduit_auth?sslmode=disable
      AUTH_GRPC_ADDR: :9001
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-development-only-change-me-jwt-secret}
      AUTH_PASSWORD_PEPPER: ${AUTH_PASSWORD_PEPPER:-development-change-me-pepper}
    ports: ["9001:9001"]
    depends_on:
      <<: *service-dependencies
      auth-migrate:
        condition: service_completed_successfully

  auth-migrate:
    <<: *service
    profiles: [microservices]
    entrypoint: ["/app/goose"]
    command: ["-dir", "/app/migrations/auth", "postgres", "postgres://conduit_auth:auth@postgres:5432/conduit_auth?sslmode=disable", "up"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  profile:
    <<: *service
    profiles: [microservices]
    entrypoint: ["/app/profile"]
    command: ["--addr=:9002"]
    environment:
      <<: *service-environment
      PROFILE_DB_DSN: postgres://conduit_profile:profile@postgres:5432/conduit_profile?sslmode=disable
      PROFILE_GRPC_ADDR: :9002
      PROFILE_REDIS_ADDR: redis:6379
    ports: ["9002:9002"]
    depends_on:
      <<: *service-dependencies
      profile-migrate:
        condition: service_completed_successfully

  profile-migrate:
    <<: *service
    profiles: [microservices]
    entrypoint: ["/app/goose"]
    command: ["-dir", "/app/migrations/profile", "postgres", "postgres://conduit_profile:profile@postgres:5432/conduit_profile?sslmode=disable", "up"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  posts:
    <<: *service
    profiles: [microservices]
    entrypoint: ["/app/posts"]
    command: ["--addr=:9003"]
    environment:
      <<: *service-environment
      POSTS_DB_DSN: postgres://conduit_posts:posts@postgres:5432/conduit_posts?sslmode=disable
      POSTS_GRPC_ADDR: :9003
      PROFILE_GRPC_ADDR: profile:9002
      SUBSCRIPTIONS_GRPC_ADDR: subscriptions:9004
    ports: ["9003:9003"]
    depends_on:
      <<: *service-dependencies
      posts-migrate:
        condition: service_completed_successfully

  posts-migrate:
    <<: *service
    profiles: [microservices]
    entrypoint: ["/app/goose"]
    command: ["-dir", "/app/migrations/posts", "postgres", "postgres://conduit_posts:posts@postgres:5432/conduit_posts?sslmode=disable", "up"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  subscriptions:
    <<: *service
    profiles: [microservices]
    entrypoint: ["/app/subscriptions"]
    command: ["--config=/app/config/subscriptions.yaml", "--addr=:9004"]
    environment:
      <<: *service-environment
      SUBSCRIPTIONS_DB_DSN: postgres://conduit_subscriptions:subscriptions@postgres:5432/conduit_subscriptions?sslmode=disable
      SUBSCRIPTIONS_GRPC_ADDR: :9004
    ports: ["9004:9004"]
    depends_on:
      <<: *service-dependencies
      subscriptions-migrate:
        condition: service_completed_successfully

  subscriptions-migrate:
    <<: *service
    profiles: [microservices]
    entrypoint: ["/app/goose"]
    command: ["-dir", "/app/migrations/subscriptions", "postgres", "postgres://conduit_subscriptions:subscriptions@postgres:5432/conduit_subscriptions?sslmode=disable", "up"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  comments:
    <<: *service
    profiles: [microservices]
    entrypoint: ["/app/comments"]
    command: ["--config=/app/config/comments.yaml", "--addr=:9005"]
    environment:
      <<: *service-environment
      COMMENTS_DB_DSN: postgres://conduit_comments:comments@postgres:5432/conduit_comments?sslmode=disable
      COMMENTS_GRPC_ADDR: :9005
      POSTS_GRPC_ADDR: posts:9003
      PROFILE_GRPC_ADDR: profile:9002
    ports: ["9005:9005"]
    depends_on:
      <<: *service-dependencies
      comments-migrate:
        condition: service_completed_successfully

  comments-migrate:
    <<: *service
    profiles: [microservices]
    entrypoint: ["/app/goose"]
    command: ["-dir", "/app/migrations/comments", "postgres", "postgres://conduit_comments:comments@postgres:5432/conduit_comments?sslmode=disable", "up"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  subscriptions-outbox:
    <<: *service
    profiles: [microservices]
    entrypoint: ["/app/outbox-relay"]
    command: ["--config=/app/config/outbox-relay.yaml"]
    environment:
      <<: *service-environment
      OUTBOX_DB_DSN: postgres://conduit_subscriptions:subscriptions@postgres:5432/conduit_subscriptions?sslmode=disable
      OUTBOX_SOURCE: subscriptions
      OUTBOX_METRICS_ADDR: :9100
      KAFKA_CLIENT_ID: subscriptions-outbox
    ports: ["9101:9100"]
    depends_on:
      <<: *service-dependencies
      subscriptions-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  posts-outbox:
    <<: *service
    profiles: [microservices]
    entrypoint: ["/app/outbox-relay"]
    command: ["--config=/app/config/outbox-relay.yaml"]
    environment:
      <<: *service-environment
      OUTBOX_DB_DSN: postgres://conduit_posts:posts@postgres:5432/conduit_posts?sslmode=disable
      OUTBOX_SOURCE: posts
      OUTBOX_METRICS_ADDR: :9100
      KAFKA_CLIENT_ID: posts-outbox
    ports: ["9102:9100"]
    depends_on:
      <<: *service-dependencies
      posts-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  profile-outbox:
    <<: *service
    profiles: [microservices]
    entrypoint: ["/app/outbox-relay"]
    command: ["--config=/app/config/outbox-relay.yaml"]
    environment:
      <<: *service-environment
      OUTBOX_DB_DSN: postgres://conduit_profile:profile@postgres:5432/conduit_profile?sslmode=disable
      OUTBOX_SOURCE: profile
      OUTBOX_METRICS_ADDR: :9100
      KAFKA_CLIENT_ID: profile-outbox
    ports: ["9103:9100"]
    depends_on:
      <<: *service-dependencies
      profile-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  kafka-data:
  redis-data:

networks:
  conduit:
    name: conduit-microservices
