name: conduit-microservices

x-service: &service
  image: ${CONDUIT_IMAGE:-conduit:local}
  pull_policy: never
  restart: unless-stopped
  init: true
  environment: &service-environment
    LOG_LEVEL: ${LOG_LEVEL:-info}
    LOG_FORMAT: ${LOG_FORMAT:-json}
    KAFKA_BROKERS: kafka:9092
    REDIS_ADDR: redis:6379
  depends_on: &service-dependencies
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [conduit]

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [conduit]

  kafka:
    image: apache/kafka:4.1.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:${KAFKA_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
    ports:
      - "${KAFKA_PORT:-29092}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [conduit]

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [conduit]

  gateway-migrate:
    <<: *service
    entrypoint: ["/app/goose"]
    command: ["-dir", "/app/migrations", "postgres", "postgres://conduit_gateway:gateway@postgres:5432/conduit_gateway?sslmode=disable", "up"]
    restart: "no"
    environment:
      <<: *service-environment
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    <<: *service
    entrypoint: ["/app/conduit"]
    command: ["--addr=:8000"]
    environment:
      <<: *service-environment
      DB_DSN: postgres://conduit_gateway:gateway@postgres:5432/conduit_gateway?sslmode=disable
      AUTH_GRPC_ADDR: auth:9001
      PROFILE_GRPC_ADDR: profile:9002
      POSTS_GRPC_ADDR: posts:9003
      SUBSCRIPTIONS_GRPC_ADDR: subscriptions:9004
      COMMENTS_GRPC_ADDR: comments:9005
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-development-only-change-me-jwt-secret}
      AUTH_PASSWORD_PEPPER: ${AUTH_PASSWORD_PEPPER:-development-change-me-pepper}
      HTTP_ALLOWED_ORIGINS: ${HTTP_ALLOWED_ORIGINS:-*}
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    depends_on:
      <<: *service-dependencies
      gateway-migrate:
        condition: service_completed_successfully

  auth:
    <<: *service
    profiles: [microservices]
    entrypoint: ["/app/auth"]
    command: ["--addr=:9001"]
    environment:
      <<: *service-environment
      AUTH_DB_DSN: postgres://conduit_auth:auth@postgres:5432/conduit_auth?sslmode=disable
      AUTH_GRPC_ADDR: :9001
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-development-only-change-me-jwt-secret}
      AUTH_PASSWORD_PEPPER: ${AUTH_PASSWORD_PEPPER:-development-change-me-pepper}
    ports: ["9001:9001"]

  profile:
    <<: *service
    profiles: [microservices]
    entrypoint: ["/app/profile"]
    command: ["--addr=:9002"]
    environment:
      <<: *service-environment
      PROFILE_DB_DSN: postgres://conduit_profile:profile@postgres:5432/conduit_profile?sslmode=disable
      PROFILE_GRPC_ADDR: :9002
      SUBSCRIPTIONS_GRPC_ADDR: subscriptions:9004
    ports: ["9002:9002"]

  posts:
    <<: *service
    profiles: [microservices]
    entrypoint: ["/app/posts"]
    command: ["--addr=:9003"]
    environment:
      <<: *service-environment
      POSTS_DB_DSN: postgres://conduit_posts:posts@postgres:5432/conduit_posts?sslmode=disable
      POSTS_GRPC_ADDR: :9003
      PROFILE_GRPC_ADDR: profile:9002
      SUBSCRIPTIONS_GRPC_ADDR: subscriptions:9004
    ports: ["9003:9003"]

  subscriptions:
    <<: *service
    profiles: [microservices]
    entrypoint: ["/app/subscriptions"]
    command: ["--config=/app/config/subscriptions.yaml", "--addr=:9004"]
    environment:
      <<: *service-environment
      SUBSCRIPTIONS_DB_DSN: postgres://conduit_subscriptions:subscriptions@postgres:5432/conduit_subscriptions?sslmode=disable
      SUBSCRIPTIONS_GRPC_ADDR: :9004
    ports: ["9004:9004"]

  comments:
    <<: *service
    profiles: [microservices]
    entrypoint: ["/app/comments"]
    command: ["--addr=:9005"]
    environment:
      <<: *service-environment
      COMMENTS_DB_DSN: postgres://conduit_comments:comments@postgres:5432/conduit_comments?sslmode=disable
      COMMENTS_GRPC_ADDR: :9005
      POSTS_GRPC_ADDR: posts:9003
      PROFILE_GRPC_ADDR: profile:9002
    ports: ["9005:9005"]

volumes:
  postgres-data:
  kafka-data:
  redis-data:

networks:
  conduit:
    name: conduit-microservices
