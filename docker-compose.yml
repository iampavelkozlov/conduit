x-conduit-image: &conduit-image
  image: ${CONDUIT_IMAGE:-conduit:local}

services:
  postgres:
    image: postgres:16-alpine
    container_name: conduit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: conduit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d conduit"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    <<: *conduit-image
    pull_policy: never
    entrypoint: ["/app/goose"]
    command: ["up"]
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://postgres:postgres@postgres:5432/conduit?sslmode=disable
      GOOSE_MIGRATION_DIR: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  conduit:
    <<: *conduit-image
    build:
      context: .
    pull_policy: ${CONDUIT_PULL_POLICY:-build}
    restart: unless-stopped
    environment:
      DB_DSN: postgres://postgres:postgres@postgres:5432/conduit?sslmode=disable
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-development-only-change-me-jwt-secret}
      AUTH_PASSWORD_PEPPER: ${AUTH_PASSWORD_PEPPER:-development-change-me-pepper}
      AUTH_ACCESS_TOKEN_TTL: ${AUTH_ACCESS_TOKEN_TTL:-15m}
      AUTH_REFRESH_TOKEN_TTL: ${AUTH_REFRESH_TOKEN_TTL:-720h}
      HTTP_ALLOWED_ORIGINS: ${HTTP_ALLOWED_ORIGINS:-*}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    <<: *conduit-image
    pull_policy: never
    entrypoint: ["/app/frontend"]
    command: ["--config=/app/config/frontend.yaml"]
    restart: unless-stopped
    environment:
      FRONTEND_API_URL: http://conduit:8000/api
      FRONTEND_LOG_LEVEL: ${FRONTEND_LOG_LEVEL:-info}
      FRONTEND_LOG_FORMAT: ${FRONTEND_LOG_FORMAT:-json}
      FRONTEND_COOKIE_SECURE: ${FRONTEND_COOKIE_SECURE:-false}
    ports:
      - "3000:3000"
    depends_on:
      conduit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
