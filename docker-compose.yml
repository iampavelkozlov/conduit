x-conduit-image: &conduit-image
  image: ${CONDUIT_API_IMAGE:-conduit-api:local}
  build:
    context: .
    target: api-runtime
  pull_policy: ${CONDUIT_API_PULL_POLICY:-build}

services:
  postgres:
    image: postgres:16-alpine
    container_name: conduit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-conduit}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: UTC
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    <<: *conduit-image
    entrypoint: ["/app/goose"]
    command: ["up"]
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-conduit}?sslmode=disable
      GOOSE_MIGRATION_DIR: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  conduit:
    <<: *conduit-image
    restart: unless-stopped
    environment:
      DB_DSN: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-conduit}?sslmode=disable
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-development-only-change-me-jwt-secret}
      AUTH_PASSWORD_PEPPER: ${AUTH_PASSWORD_PEPPER:-development-change-me-pepper}
      AUTH_ACCESS_TOKEN_TTL: ${AUTH_ACCESS_TOKEN_TTL:-15m}
      AUTH_REFRESH_TOKEN_TTL: ${AUTH_REFRESH_TOKEN_TTL:-720h}
      HTTP_ALLOWED_ORIGINS: ${HTTP_ALLOWED_ORIGINS:-*}
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    image: ${CONDUIT_FRONTEND_IMAGE:-conduit-frontend:local}
    build:
      context: .
      target: frontend-runtime
    pull_policy: ${CONDUIT_FRONTEND_PULL_POLICY:-build}
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    ports:
      - "${CONDUIT_BIND_ADDRESS:-0.0.0.0}:80:80"
      - "${CONDUIT_BIND_ADDRESS:-0.0.0.0}:443:443"
    volumes:
      - ./.data/certs:/etc/nginx/certs
    depends_on:
      conduit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --no-check-certificate --spider https://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
